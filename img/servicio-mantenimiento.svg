<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Mantenimiento web: ventana de navegador revisada, engrane y medidor de velocidad">
  <rect width="800" height="450" fill="#fca311"/>
  <circle cx="700" cy="60" r="130" fill="#ffffff" opacity="0.18"/>
  <circle cx="60" cy="420" r="120" fill="#14213d" opacity="0.12"/>
  <!-- browser -->
  <rect x="70" y="70" width="400" height="290" rx="16" fill="#ffffff"/>
  <rect x="70" y="70" width="400" height="40" rx="16" fill="#14213d"/>
  <rect x="70" y="94" width="400" height="16" fill="#14213d"/>
  <circle cx="96" cy="90" r="6" fill="#e0245e"/><circle cx="116" cy="90" r="6" fill="#fca311"/><circle cx="136" cy="90" r="6" fill="#25d366"/>
  <rect x="160" y="82" width="280" height="16" rx="8" fill="#1f3a68"/>
  <g>
    <circle cx="112" cy="150" r="14" fill="#1f8a7d"/><path d="M105 150 L110 156 L120 144" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="143" width="200" height="14" rx="7" fill="#dde2ee"/>
    <circle cx="112" cy="200" r="14" fill="#1f8a7d"/><path d="M105 200 L110 206 L120 194" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="193" width="240" height="14" rx="7" fill="#dde2ee"/>
    <circle cx="112" cy="250" r="14" fill="#1f8a7d"/><path d="M105 250 L110 256 L120 244" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="243" width="180" height="14" rx="7" fill="#dde2ee"/>
    <circle cx="112" cy="300" r="14" fill="#1f8a7d"/><path d="M105 300 L110 306 L120 294" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="140" y="293" width="220" height="14" rx="7" fill="#dde2ee"/>
  </g>
  <!-- gear -->
  <g transform="translate(600 150)">
    <g fill="#14213d">
      <rect x="-14" y="-90" width="28" height="36" rx="6"/><rect x="-14" y="54" width="28" height="36" rx="6"/>
      <rect x="-90" y="-14" width="36" height="28" rx="6"/><rect x="54" y="-14" width="36" height="28" rx="6"/>
      <rect x="-14" y="-90" width="28" height="36" rx="6" transform="rotate(45)"/><rect x="-14" y="54" width="28" height="36" rx="6" transform="rotate(45)"/>
      <rect x="-90" y="-14" width="36" height="28" rx="6" transform="rotate(45)"/><rect x="54" y="-14" width="36" height="28" rx="6" transform="rotate(45)"/>
    </g>
    <circle r="64" fill="#14213d"/>
    <circle r="26" fill="#fca311"/>
  </g>
  <!-- speed gauge -->
  <g transform="translate(610 340)">
    <path d="M-90 0 A90 90 0 0 1 90 0" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <path d="M-90 0 A90 90 0 0 1 64 -64" fill="none" stroke="#1f8a7d" stroke-width="20" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="52" y2="-52" stroke="#14213d" stroke-width="8" stroke-linecap="round"/>
    <circle r="12" fill="#14213d"/>
  </g>
  <text x="270" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#14213d">Tu sitio siempre al día y funcionando</text>
</svg>
