<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tienda en línea en un celular con catálogo de productos y botón de pedido">
  <rect width="800" height="450" fill="#1f8a7d"/>
  <circle cx="120" cy="90" r="140" fill="#14213d" opacity="0.18"/>
  <circle cx="700" cy="380" r="160" fill="#fca311" opacity="0.18"/>
  <!-- phone -->
  <rect x="290" y="30" width="220" height="390" rx="28" fill="#14213d"/>
  <rect x="304" y="52" width="192" height="346" rx="12" fill="#f5f7fb"/>
  <rect x="304" y="52" width="192" height="36" fill="#14213d"/>
