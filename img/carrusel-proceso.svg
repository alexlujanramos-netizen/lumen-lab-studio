<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Proceso de trabajo de Lumen Lab Studio en cuatro pasos: escuchar, diseñar, desarrollar y acompañar">
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14213d"/><stop offset="1" stop-color="#1f3a68"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#p1)"/>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Nuestro proceso en <tspan fill="#fca311">4 pasos</tspan></text>
  <line x1="130" y1="210" x2="670" y2="210" stroke="#fca311" stroke-width="6" stroke-dasharray="14 10"/>
  <!-- step 1 -->
  <g transform="translate(130 210)">
    <circle r="62" fill="#fca311"/>
    <path d="M-22 -18 H22 V12 H-4 L-16 22 V12 H-22 Z" fill="#14213d"/>
    <text y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">1. Escuchar</text>
    <text y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d6def0">Conocemos tu negocio</text>
  </g>
  <!-- step 2 -->
  <g transform="translate(310 210)">
    <circle r="62" fill="#ffffff"/>
    <path d="M-20 22 L-14 4 L14 -24 L24 -14 L-4 14 Z" fill="#1f8a7d"/>
    <path d="M-20 22 L-14 4 L-4 14 Z" fill="#14213d"/>
    <text y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">2. Diseñar</text>
    <text y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d6def0">Proponemos el estilo</text>
  </g>
  <!-- step 3 -->
  <g transform="translate(490 210)">
    <circle r="62" fill="#fca311"/>
    <path d="M-14 -16 L-30 0 L-14 16 M14 -16 L30 0 L14 16 M6 -22 L-6 22" fill="none" stroke="#14213d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">3. Desarrollar</text>
    <text y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d6def0">Programamos en HTML y CSS</text>
  </g>
  <!-- step 4 -->
  <g transform="translate(670 210)">
    <circle r="62" fill="#ffffff"/>
    <path d="M0 26 C-30 6 -30 -22 -12 -22 C-4 -22 0 -14 0 -14 C0 -14 4 -22 12 -22 C30 -22 30 6 0 26 Z" fill="#1f8a7d"/>
    <text y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">4. Acompañar</text>
    <text y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d6def0">Te capacitamos y apoyamos</text>
  </g>
</svg>
